<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>背單字小幫手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">純前端練習</p>
        <h1>背單字小幫手</h1>
        <p class="subtitle">點擊卡片翻頁，管理頁自行新增與自動填入單字資訊。</p>
      </div>
      <nav class="tab-bar" role="tablist" aria-label="應用頁面">
        <button id="studyTab" class="tab active" role="tab" aria-selected="true">單字卡</button>
        <button id="manageTab" class="tab" role="tab" aria-selected="false">管理頁</button>
      </nav>
    </header>

    <main>
      <section id="studyPage" class="page active" role="tabpanel">
        <div class="study-panel">
          <div class="card-frame">
            <div class="flip-card">
              <div class="flip-card-inner">
                <div class="flip-card-face card-front" id="cardFront">請新增單字</div>
                <div class="flip-card-face card-back" id="cardBack">
                  <p>卡片背面顯示單字資訊，請前往管理頁新增。</p>
                </div>
              </div>
            </div>
          </div>
          <div class="study-meta">
            <label for="wordSelect">選擇單字</label>
            <select id="wordSelect" class="field"></select>
            <p class="hint">卡片點擊可翻面，查看例句與字根分析。</p>
          </div>
        </div>
      </section>

      <section id="managePage" class="page" role="tabpanel" hidden>
        <div class="manage-grid">
          <form id="addForm" class="manage-form">
            <div class="form-header">
              <h2 id="editIndicator">新增單字</h2>
              <p class="mini-text">輸入欄位後可儲存至本機，並可透過自動填入補齊資料。</p>
            </div>
            <label>英文單字</label>
            <input id="wordInput" class="field" type="text" placeholder="例如：knowledge" autocomplete="off" required />

            <label>中文翻譯</label>
            <input id="translateInput" class="field" type="text" placeholder="例如：知識" />

            <label>詞性</label>
            <input id="posInput" class="field" type="text" placeholder="例如：noun, verb" />

            <label>例句</label>
            <textarea id="exampleInput" class="field" rows="3" placeholder="例如：She gained a lot of knowledge from reading."></textarea>

            <label>字根分析</label>
            <textarea id="rootInput" class="field" rows="3" placeholder="例如：know（知道）+ledge（名詞字尾）"></textarea>

            <div class="button-row">
              <button id="autoFillButton" type="button" class="button secondary">自動填入</button>
              <button id="saveButton" type="submit" class="button">儲存單字</button>
              <button id="deleteButton" type="button" class="button danger" hidden>刪除單字</button>
            </div>
            <p id="statusMessage" class="status-message"></p>
          </form>

          <div class="manage-list">
            <h2>單字列表</h2>
            <table>
              <thead>
                <tr>
                  <th>英文</th>
                  <th>翻譯</th>
                  <th>詞性</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="wordListBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2026 背單字小幫手 • 純前端實作</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
